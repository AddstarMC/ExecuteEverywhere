name: ExecuteEverywhere
version: ${version}
main: au.com.addstar.executeeverywhere.ExecuteEverywhere
api-version: '1.20'
description: Runs a console command on every connected server via Redis pub/sub.
authors: [vemacs, AddstarMC]
commands:
  ee:
    description: Runs a console command on every connected server.
    aliases: [executeeverywhere]
    permission: executeeverywhere.use
    usage: /ee <command>
  eestatus:
    description: Shows the Redis connection status for ExecuteEverywhere.
    permission: executeeverywhere.status
    usage: /eestatus
permissions:
  executeeverywhere.use:
    description: Send a command to run on every server.
    default: op
  executeeverywhere.status:
    description: View the Redis connection status.
    default: op
